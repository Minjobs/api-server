<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-X0NBJELTKD"></script>
<script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ซาจู - วิเคราะห์ดวงชะตาเกาหลี</title>
        <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Niramit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        /* --- 공통 테마 --- */
        body { margin: 0; padding: 0; background-color: #0a0a12; color: white; font-family: 'Niramit', sans-serif; min-height: 100vh; overflow-x: hidden; }
        .magic-background { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a12 100%); }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; }
        .logo { font-family: 'Cinzel Decorative'; color: #ffd700; font-size: 1.2rem; cursor: pointer; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .profile-container { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; border: 2px solid #ffd700; cursor: pointer; }
        .profile-container img { width: 100%; height: 100%; object-fit: cover; }

        /* --- 입력 섹션 스타일 --- */
        .intro-section { text-align: center; margin-bottom: 30px; }
        .intro-tagline { background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.2), transparent); padding: 10px; font-weight: 500; margin-bottom: 15px; border-top: 1px solid rgba(255, 215, 0, 0.3); border-bottom: 1px solid rgba(255, 215, 0, 0.3); font-size: 0.9rem; }
        #pageTitle { font-family: 'Cinzel Decorative'; color: #ffd700; font-size: 2.2rem; margin: 10px 0; letter-spacing: 2px; }
        #pageDesc { color: #aaa; font-size: 0.95rem; line-height: 1.6; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 215, 0, 0.2); border-radius: 30px; padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .field { margin-bottom: 22px; }
        label { display: block; color: #ffd700; font-size: 0.85rem; margin-bottom: 8px; font-weight: 500; }
        input, select { width: 100%; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 15px; padding: 14px; color: white; font-size: 1rem; box-sizing: border-box; outline: none; }
        .dropdown-group { display: flex; gap: 10px; }
        .dropdown-group select { flex: 1; }
        .unknown-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: #888; padding: 6px 16px; border-radius: 20px; font-size: 0.75rem; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .unknown-btn.active { background: #ffd700; color: #000; font-weight: 700; }
        .submit-btn { width: 100%; background: linear-gradient(45deg, #ffd700, #ffae00); color: #000; border: none; padding: 18px; border-radius: 20px; font-weight: 700; font-size: 1.1rem; margin-top: 25px; cursor: pointer; box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3); }

        /* --- 신비로운 로딩 섹션 스타일 --- */
        #loadingSection { display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 80px 20px; animation: fadeIn 0.8s ease; }
        .orb-wrapper { position: relative; width: 150px; height: 150px; margin-bottom: 40px; }
        .orb { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at center, rgba(255, 215, 0, 0.6) 0%, transparent 70%); filter: blur(15px); animation: pulse 2s infinite ease-in-out; }
        .mystic-spinner { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 3px solid transparent; border-top: 3px solid #ffd700; border-radius: 50%; animation: spin 1.2s linear infinite; }
        .loading-title { font-family: 'Cinzel Decorative'; color: #ffd700; font-size: 1.8rem; margin-bottom: 15px; }
        #dynamicText { color: #fff; font-size: 1.1rem; transition: opacity 0.5s ease; min-height: 1.5em; font-weight: 500; }
        .loading-desc { color: #555; font-size: 0.85rem; margin-top: 25px; letter-spacing: 1px; }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(0.85); opacity: 0.4; } 50% { transform: scale(1.1); opacity: 0.8; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .hidden { display: none !important; }
        .visible-flex { display: flex !important; }
        footer { text-align: center; margin-top: 40px; color: #444; font-size: 0.8rem; padding-bottom: 20px; }
    </style>
</head>
<body>

    <div class="magic-background"></div>

    <div class="container">
        <header>
            <div class="logo" onclick="location.href='/'">ซาจู</div>
            <div class="profile-container" onclick="location.href='/profile'">
                <img id="userProfileImg" src="https://www.gstatic.com/images/branding/product/1x/avatar_circle_blue_512dp.png" alt="Profile">
            </div>
        </header>

        <main id="inputSection">
            <section class="intro-section">
                <div class="intro-tagline">ศาสตร์แห่งโชคชะตา เกาหลี 🇰🇷 + ไทย 🇹🇭</div>
                <h2 id="pageTitle">...</h2>
                <p id="pageDesc">...</p>
            </section>

            <div class="glass-card">
                <form id="fortuneForm">
                    <div class="field">
                        <label>ชื่อจริง (Name)</label>
                        <input type="text" id="realName" placeholder="ระบุชื่อจริงของคุณ" required>
                    </div>
                    <div class="field">
                        <label>ชื่อเล่น (Nickname)</label>
                        <input type="text" id="nickName" placeholder="ระบุชื่อเล่น" required>
                    </div>
                    <div class="field">
                        <label>วันเดือนปีเกิด (Date of Birth)</label>
                        <div class="dropdown-group">
                            <select id="birthDay" required><option value="" disabled selected>วันที่</option></select>
                            <select id="birthMonth" required>
                                <option value="" disabled selected>เดือน</option>
                                <option value="01">มกราคม (Jan)</option>
                                <option value="02">กุมภาพันธ์ (Feb)</option>
                                <option value="03">มีนาคม (Mar)</option>
                                <option value="04">เมษายน (Apr)</option>
                                <option value="05">พฤษภาคม (May)</option>
                                <option value="06">มิถุนายน (Jun)</option>
                                <option value="07">กรกฎาคม (Jul)</option>
                                <option value="08">สิงหาคม (Aug)</option>
                                <option value="09">กันยายน (Sep)</option>
                                <option value="10">ตุลาคม (Oct)</option>
                                <option value="11">พฤศจิกายน (Nov)</option>
                                <option value="12">ธันวาคม (Dec)</option>
                            </select>
                            <select id="birthYear" required><option value="" disabled selected>ปี ค.ศ.</option></select>
                        </div>
                    </div>
                    <div class="field">
                        <label>เวลาเกิด (Birth Time)</label>
                        <div class="dropdown-group">
                            <select id="birthHour" required><option value="" disabled selected>ชั่วโมง</option></select>
                            <select id="birthMin" required><option value="" disabled selected>นาที</option></select>
                        </div>
                        <button type="button" id="unknownTimeBtn" class="unknown-btn">ไม่ทราบเวลาเกิด</button>
                    </div>
                    <div class="field">
                        <label>เพศ (Gender Identity)</label>
                        <select id="gender" required>
                            <option value="" disabled selected>เลือกเพศ</option>
                            <option value="male">ชาย (Male)</option>
                            <option value="female">หญิง (Female)</option>
                            <option value="tom">ทอม (Tom)</option>
                            <option value="ladyboy">กะเทย (Kathoey)</option>
                            <option value="gay">เกย์ (Gay)</option>
                            <option value="lesbian">เลสเบี้ยน (Lesbian)</option>
                            <option value="other">อื่นๆ (Other)</option>
                        </select>
                    </div>
                    <button type="submit" class="submit-btn" id="submitBtn">ดูผลทำนายของคุณ</button>
                </form>
            </div>
        </main>

        <div id="loadingSection">
            <div class="orb-wrapper">
                <div class="orb"></div>
                <div class="mystic-spinner"></div>
            </div>
            <h2 class="loading-title">Reading Destiny</h2>
            <div id="dynamicText">กำลังเริ่มการวิเคราะห์...</div>
            <p class="loading-desc">
                มหาเทพกำลังเปิดบันทึกโชคชะตาของคุณ <br> โปรดรอสักครู่...
            </p>
        </div>

        <footer>
            <p>© 2026 saju. บันทึกแห่งโชคชะตาที่ถูกลิขิต</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const API_KEY = 'wodmfjc8202oj4tnguf9wo2k2jrnjdwow0011k2k2n3nfnnfndsiow901o2kkemrx999dej3j';
            const path = window.location.pathname;
            const type = path.split('/').pop() || 'personality';

            const inputSection = document.getElementById('inputSection');
            const loadingSection = document.getElementById('loadingSection');
            const dynamicText = document.getElementById('dynamicText');
            const form = document.getElementById('fortuneForm');

            // [1] 타이틀 및 로딩 메시지 설정
            const config = {
                personality: { title: "Personality", desc: "ค้นหาตัวตนที่แท้จริงและจุดแข็งที่ซ่อนอยู่ของคุณ" },
                wealth: { title: "Wealth", desc: "เจาะลึกดวงการเงินและโอกาสแห่งความมั่งคั่ง" },
                romance: { title: "Romance", desc: "ตามหาเนื้อคู่และเส้นทางความรักที่ฟ้าลิขิต" }
            };
            const loadingMessages = [
                "กำลังวิเคราะห์ชื่อของคุณ...",        // 이름 분석 중
                "ตรวจสอบชื่อเล่นและตัวตน...",      // 닉네임 분석 중
                "วิเคราะห์วันเดือนปีเกิดและดวงดาว...", // 생년월일 분석 중
                "กำลังจับคู่ชื่อและโชคชะตา...",      // 이름과 생년월일 매칭 중
                "ถอดรหัสบันทึกมหาเทพ..."         // 신의 기록 해독 중
            ];

            const page = config[type] || config.personality;
            document.getElementById('pageTitle').innerText = page.title;
            document.getElementById('pageDesc').innerText = page.desc;

            // [2] 프로필 로드
            try {
                const res = await fetch('/api/user/profile', { headers: { 'x-api-key': API_KEY } });
                if (res.ok) {
                    const user = await res.json();
                    document.getElementById('userProfileImg').src = user.profile_img || document.getElementById('userProfileImg').src;
                }
            } catch (e) { console.error(e); }

            // [3] 드롭다운 데이터 생성
            const daySel = document.getElementById('birthDay');
            const yearSel = document.getElementById('birthYear');
            const hourSel = document.getElementById('birthHour');
            const minSel = document.getElementById('birthMin');

            for(let i=1; i<=31; i++) daySel.add(new Option(i, i < 10 ? `0${i}` : i));
            for(let i=new Date().getFullYear(); i>=1900; i--) yearSel.add(new Option(i, i));
            for(let i=0; i<24; i++) hourSel.add(new Option(i<10?`0${i}`:i, i<10?`0${i}`:i));
            for(let i=0; i<60; i++) minSel.add(new Option(i<10?`0${i}`:i, i<10?`0${i}`:i));

            // [4] 시간 모름 토글
            let isTimeUnknown = false;
            document.getElementById('unknownTimeBtn').addEventListener('click', function() {
                isTimeUnknown = !isTimeUnknown;
                this.classList.toggle('active');
                hourSel.disabled = minSel.disabled = isTimeUnknown;
                hourSel.required = minSel.required = !isTimeUnknown;
                hourSel.style.opacity = isTimeUnknown ? '0.3' : '1';
                minSel.style.opacity = isTimeUnknown ? '0.3' : '1';
                if(isTimeUnknown) { hourSel.selectedIndex = 0; minSel.selectedIndex = 0; }
            });

            // [5] 폼 제출 및 로딩 제어
            let isSubmitting = false;
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                if (isSubmitting) return;

                const payload = {
                    type: type,
                    realName: document.getElementById('realName').value,
                    nickName: document.getElementById('nickName').value,
                    birthDate: `${yearSel.value}-${document.getElementById('birthMonth').value}-${daySel.value}`,
                    birthTime: isTimeUnknown ? "unknown" : `${hourSel.value}:${minSel.value}`,
                    gender: document.getElementById('gender').value
                };

                // 화면 전환 및 클리어
                isSubmitting = true;
                inputSection.classList.add('hidden');
                loadingSection.classList.add('visible-flex');
                
                form.reset();
                document.querySelectorAll('select').forEach(sel => sel.selectedIndex = 0);

                // 로딩 문구 사이클링 (4초마다 변경)
                let msgIdx = 0;
                const interval = setInterval(() => {
                    msgIdx++;
                    if (loadingMessages[msgIdx] && dynamicText) {
                        dynamicText.style.opacity = 0;
                        setTimeout(() => {
                            dynamicText.innerText = loadingMessages[msgIdx];
                            dynamicText.style.opacity = 1;
                        }, 500);
                    } else { clearInterval(interval); }
                }, 4000);

                try {
                    const response = await fetch('/api/fortune/analyze', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();

                    if (response.ok && result.resultId) {
                        window.location.href = `/result/${result.resultId}`;
                    } else { throw new Error(); }
                } catch (err) {
                    clearInterval(interval);
                    alert("เกิดข้อผิดพลาด โปรดลองใหมีกครั้ง");
                    location.reload();
                }
            });
        });
    </script>
</body>
</html>
