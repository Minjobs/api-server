<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ซาจู - เสี่ยงทายธง 5 สี</title>
        <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">

    
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --bg-overlay: rgba(0, 0, 0, 0.55); 
            --point-gold: #ffd700;
            --point-red: #ff4757;
            --text-white: #ffffff;
            --border-line: rgba(255, 215, 0, 0.5); 
            --glow-gold: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        body {
            margin: 0; padding: 0;
            background-color: #1a1a1a; 
            font-family: 'Kanit', sans-serif;
            color: var(--text-white);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .background-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-image: url('/background.jpg'); 
            background-size: cover; background-position: center;
            opacity: 0.7; 
        }

        .header-logo { margin-top: 25px; margin-bottom: 20px; z-index: 10; cursor: pointer; transition: 0.3s; }
        .header-logo img { height: 40px; }
        .header-logo:active { transform: scale(0.95); }

        .container {
            width: 90%; max-width: 440px;
            background-color: var(--bg-overlay);
            border-radius: 35px;
            padding: 35px 20px 45px 20px;
            box-sizing: border-box;
            backdrop-filter: blur(10px); 
            border: 2px solid var(--border-line);
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        .intro-text h1 { 
            font-family: 'Nanum Myeongjo', serif; 
            font-size: 1.9rem; color: var(--point-gold); 
            text-shadow: var(--glow-gold); margin: 0 0 10px 0; 
        }
        .intro-text p { font-size: 0.95rem; opacity: 0.9; font-weight: 300; line-height: 1.6; margin: 0 0 15px 0; }

        .stage-wrapper {
            min-height: 280px; 
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
            position: relative;
            margin: 20px auto;
            width: 100%;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 20px;
        }

        .flag-rows {
            display: flex; flex-direction: column; gap: 15px; 
            align-items: center;
            width: 100%;
        }

        .flag-row {
            display: flex; justify-content: center; gap: 20px; 
            width: 100%;
        }

        .flag-img {
            width: 90px; 
            height: auto;
            filter: drop-shadow(0 5px 8px rgba(0,0,0,0.5));
            transition: transform 0.3s ease;
            position: relative; 
        }

        .shaking .flag-img {
            animation: shake-flag 0.2s infinite ease-in-out alternate;
        }
        
        .shaking .flag-img:nth-child(odd) { animation-delay: 0s; }
        .shaking .flag-img:nth-child(even) { animation-delay: 0.1s; }

        @keyframes shake-flag {
            0% { transform: rotate(-5deg) translateY(0); }
            100% { transform: rotate(5deg) translateY(-2px); }
        }

        #result-display {
            display: none;
            flex-direction: column; align-items: center;
            padding: 10px 0;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .result-stage {
            border: 2px solid var(--point-gold);
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 25px 15px;
            margin-bottom: 25px;
            width: 100%; box-sizing: border-box;
            box-shadow: inset 0 0 20px rgba(255, 215, 0, 0.1);
        }

        .result-flag-img { 
            width: 140px; margin-bottom: 15px; 
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.2));
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        .fate-title { font-size: 1.8rem; font-weight: 800; color: var(--point-gold); margin-bottom: 10px; line-height: 1.2; }
        .fate-desc { font-size: 1rem; font-weight: 300; line-height: 1.7; color: #eee; margin-bottom: 15px; word-break: break-word; }

        .container.bad-luck { border-color: var(--point-red); box-shadow: 0 20px 60px rgba(255, 71, 87, 0.2); }
        .bad-luck .result-stage { border-color: var(--point-red); box-shadow: inset 0 0 20px rgba(255, 71, 87, 0.2); }
        .bad-luck .fate-title { color: var(--point-red); }

        .action-btn {
            width: 85%; padding: 16px; border: none; border-radius: 40px;
            font-size: 1.2rem; font-weight: 700; cursor: pointer; font-family: 'Kanit';
            transition: all 0.2s; margin: 0 auto; display: block;
        }
        
        #shakeBtn {
            background: linear-gradient(135deg, var(--point-gold), #f57c00);
            color: #000; box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3);
        }
        #shakeBtn:active { transform: scale(0.96); }

        .retry-btn {
            background: transparent; border: 1px solid rgba(255,255,255,0.4); color: #ccc;
            width: auto; padding: 10px 30px; font-size: 0.95rem; display: inline-block;
        }
        .retry-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

        .aekdaem-btn { 
            background: var(--point-red); color: white; 
            box-shadow: 0 5px 20px rgba(255, 71, 87, 0.4); margin-bottom: 15px;
        }

        .hidden { display: none !important; }
        @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        
        footer { text-align: center; margin-top: 25px; color: rgba(255,255,255,0.3); font-size: 0.75rem; }
    </style>
</head>
<body>

    <div class="background-overlay"></div>

    <audio id="sfx-shake" src="/sound/shake.mp3" loop></audio>
    <audio id="sfx-result" src="/sound/result.mp3"></audio>

    <header class="header-logo" onclick="location.href='/'">
        <img src="/textlogo.png" alt="เมอร์ดู เค">
    </header>

    <main class="container">
        
        <div id="ritual-view">
            <div class="intro-text">
                <h1>เสี่ยงทายธง 5 สี</h1>
                <p>ตั้งจิตอธิษฐานถึงเรื่องที่กังวลใจ<br>แล้วเขย่าธงเพื่อรับคำชี้แนะจากเทพเจ้า</p>
            </div>

            <div class="stage-wrapper" id="stage">
                <div class="flag-rows">
                    <div class="flag-row">
                        <img src="/flag/flag_red.png" class="flag-img" alt="สีแดง">
                        <img src="/flag/flag_white.png" class="flag-img" alt="สีขาว">
                        <img src="/flag/flag_yellow.png" class="flag-img" alt="สีเหลือง">
                    </div>
                    <div class="flag-row">
                        <img src="/flag/flag_blue.png" class="flag-img" alt="สีน้ำเงิน">
                        <img src="/flag/flag_black.png" class="flag-img" alt="สีดำ">
                    </div>
                </div>
            </div>

            <button id="shakeBtn" class="action-btn" onclick="startRitual()">เขย่าธง</button>
        </div>

        <div id="result-display">
            <div class="result-stage">
                <img src="" id="resImg" class="result-flag-img">
                <div class="fate-title" id="resTitle"></div>
                <div class="fate-desc" id="resDesc"></div>
            </div>
            
            <div id="btn-group-normal">
                <button class="action-btn retry-btn" onclick="closeResultView()">อธิษฐานใหม่อีกครั้ง</button>
            </div>

            <div id="btn-group-bad" style="display:none;">
                <button class="action-btn aekdaem-btn" onclick="doAekDaem()">สะเดาะเคราะห์</button>
                <button class="action-btn retry-btn" style="border: none;" onclick="closeResultView()">ยอมรับคำทำนาย</button>
            </div>
        </div>

    </main>

    <footer>© 2026 เมอร์ดู เค. บันทึกแห่งดวงดาว</footer>

    <script>
        const flags = [
            { src: '/flag/flag_red.png', status: '🚩 ธงแดง: มหาโชค', desc: 'ดวงเปิด ฟ้าเปิด! สิ่งศักดิ์สิทธิ์ให้พรคุณแล้ว สิ่งที่คุณคิดหรือหวังไว้จะสำเร็จอย่างปาฏิหาริย์ การเงินคล่องตัว การงานก้าวหน้า เป็นจังหวะที่ดีที่สุดในการเริ่มต้นทำสิ่งใหม่ๆ ลุยได้เลย!', isBad: false },
            { src: '/flag/flag_white.png', status: '🏳️ ธงขาว: เทพรักษา', desc: 'ความบริสุทธิ์และความจริงใจจะชนะทุกสิ่ง! ปัญหาที่เคยติดขัดจะคลี่คลายเหมือนยกภูเขาออกจากอก จะมี "ผู้ใหญ่ใจดี" หรือกัลยาณมิตรยื่นมือเข้ามาช่วยเหลือ ให้หมั่นสวดมนต์ไหว้พระแล้วชีวิตจะรุ่งโรจน์', isBad: false },
            { src: '/flag/flag_yellow.png', status: '🟡 ธงเหลือง: ลาภบรรพชน', desc: 'บรรพบุรุษและเจ้าที่เจ้าทางกำลังมองดูคุณอยู่! ท่านอยากให้คุณสมหวัง แต่อาจต้องการให้คุณทำบุญอุทิศส่วนกุศลให้ท่านบ้าง ลองถวายของไหว้หรือทำบุญโลงศพ แล้วโชคลาภแบบฟลุ๊คๆ จะวิ่งเข้าหาคุณทันที', isBad: false },
            { src: '/flag/flag_blue.png', status: '🔵 ธงน้ำเงิน: คลื่นลมแปรปรวน', desc: 'ใจเย็นๆ ก่อนนะ! ช่วงนี้จิตใจอาจจะว้าวุ่น มีเรื่องให้กังวลใจ หรือมีเกณฑ์ต้องเดินทางไกล/โยกย้ายกะทันหัน ระวังคำพูดและอารมณ์ให้มาก อย่าเพิ่งตัดสินใจเรื่องใหญ่ในวันนี้ รอให้พายุผ่านไปก่อน', isBad: false },
            { src: '/flag/flag_black.png', status: '🏴 ธงดำ: อันตราย!', desc: 'หยุดเดี๋ยวนี้! ท่านเตือนแรงๆ ว่าอย่าเพิ่งเสี่ยง! สถานการณ์ตอนนี้ไม่ดีเลย ระวังโดนหลอก ปัญหาสุขภาพ หรืออุบัติเหตุ แนะนำให้ไปทำบุญปล่อยปลา หรือบริจาคทานเพื่อแก้เคล็ด (สะเดาะเคราะห์) โดยด่วน', isBad: true }
        ];

        const shakeBtn = document.getElementById('shakeBtn');
        const stage = document.getElementById('stage');
        const ritualView = document.getElementById('ritual-view');
        const resultDisplay = document.getElementById('result-display');
        
        const sfxShake = document.getElementById('sfx-shake');
        const sfxResult = document.getElementById('sfx-result');

        // ✅ [확률 보정 변수]
        let lastResultIndex = -1;
        let streakCount = 0;

        let isShaking = false;

        function startRitual() {
            if (isShaking) return;
            isShaking = true;

            shakeBtn.innerText = "กำลังสื่อสาร...";
            shakeBtn.disabled = true;
            stage.classList.add('shaking'); 

            if (navigator.vibrate) navigator.vibrate([100, 100, 100, 100, 200]); 
            try { sfxShake.play().catch(() => {}); } catch(e){}

            setTimeout(() => {
                stopRitual();
            }, 2500);
        }

        function stopRitual() {
            stage.classList.remove('shaking');
            try { 
                sfxShake.pause(); 
                sfxShake.currentTime = 0;
                sfxResult.play().catch(() => {}); 
            } catch(e){}

            // ✅ [수정] 확률 로직: 3회 이상 연속 방지
            // 기본은 20% 랜덤이지만, 직전 결과와 같다면 streak을 체크합니다.
            let resultIndex = Math.floor(Math.random() * flags.length);

            if (resultIndex === lastResultIndex) {
                streakCount++;
            } else {
                streakCount = 1;
                lastResultIndex = resultIndex;
            }

            // 3번 연속 같은 색이면 강제로 다시 뽑음 (무한 루프 방지 포함)
            if (streakCount >= 3) {
                let newIndex = resultIndex;
                while (newIndex === resultIndex) {
                    newIndex = Math.floor(Math.random() * flags.length);
                }
                resultIndex = newIndex;
                lastResultIndex = resultIndex;
                streakCount = 1; // 스트릭 초기화
            }

            const result = flags[resultIndex];
            showResult(result);

            shakeBtn.disabled = false;
            isShaking = false;
        }

        function showResult(data) {
            ritualView.classList.add('hidden');
            resultDisplay.style.display = 'flex';

            document.getElementById('resImg').src = data.src;
            document.getElementById('resTitle').innerText = data.status;
            document.getElementById('resDesc').innerText = data.desc;

            const mainContainer = document.querySelector('.container');
            if (data.isBad) {
                mainContainer.classList.add('bad-luck');
                document.getElementById('btn-group-normal').style.display = 'none';
                document.getElementById('btn-group-bad').style.display = 'block';
                if (navigator.vibrate) navigator.vibrate(500); 
            } else {
                mainContainer.classList.remove('bad-luck');
                document.getElementById('btn-group-normal').style.display = 'block';
                document.getElementById('btn-group-bad').style.display = 'none';
            }
        }

        function closeResultView() {
            const mainContainer = document.querySelector('.container');
            mainContainer.classList.remove('bad-luck');
            resultDisplay.style.display = 'none';
            ritualView.classList.remove('hidden');
            shakeBtn.innerText = "เขย่าธง"; 
        }

        // ✅ [수정] 페이지 새로고침 제거 (필요 시 삭제 가능 함수)
        function resetAndReload() {
            closeResultView();
        }

        function doAekDaem() {
            Swal.fire({
                title: 'สะเดาะเคราะห์สำเร็จ!',
                html: 'ได้ทำการขอขมาต่อสิ่งศักดิ์สิทธิ์แล้ว<br>ร้ายจะกลายเป็นดี หนักจะกลายเป็นเบา',
                icon: 'success',
                confirmButtonText: 'สาธุ', 
                confirmButtonColor: '#ff4757',
                background: '#1a1a1a',
                color: '#fff',
                customClass: { popup: 'swal-custom' }
            }).then(() => {
                closeResultView();
            });
        }
    </script>
</body>
</html>
