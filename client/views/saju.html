<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saju - วิเคราะห์ดวงชะตาเกาหลี</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/coinPopup.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-overlay: rgba(0, 0, 0, 0.38); 
            --text-white: #ffffff;  
            --point-gold: #ffd700;
            --border-line: rgba(200, 200, 200, 0.8); 
            --input-bg: rgba(255, 255, 255, 0.1);
        }
        
        body { 
            margin: 0; padding: 0; 
            background-color: #f5f5f5; 
            font-family: 'Kanit', sans-serif; 
            color: var(--text-white); 
            min-height: 100vh; 
            display: flex; flex-direction: column; align-items: center; 
            overflow-x: hidden; 
        }

        .background-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; 
            background-image: url('/background.jpg'); 
            background-size: cover; background-position: center; 
            background-attachment: fixed; 
            opacity: 0.8; 
        }

        .background-blur { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; 
            backdrop-filter: blur(7px) brightness(1.0); 
            -webkit-backdrop-filter: blur(7px) brightness(1.0); 
        }

        .container { 
            width: 88%; max-width: 440px; margin: 20px 0; 
            background-color: var(--bg-overlay); border-radius: 30px; 
            padding: 15px 15px 30px 15px; box-sizing: border-box; 
            backdrop-filter: blur(7px); border: 3px solid var(--border-line); 
            box-shadow: 0 10px 40px rgba(0,0,0,0.3); 
        }

        header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 5px; }
        
        .logo { cursor: pointer; display: flex; align-items: center; }
        .logo img { height: 35px; width: auto; object-fit: contain; }

        .user-nav { display: flex; align-items: center; gap: 10px; }
        #coinBox { background: rgba(255, 215, 0, 0.2); border: 1px solid var(--point-gold); padding: 4px 10px; border-radius: 15px; font-size: 0.85rem; font-weight: 700; color: var(--point-gold); display: flex; align-items: center; gap: 5px; }
        .profile-circle { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; border: 2px solid var(--point-gold); }
        .profile-circle img { width: 100%; height: 100%; object-fit: cover; }
        
        .intro-section { text-align: center; margin-bottom: 25px; }
        #pageTitle { font-family: 'Nanum Myeongjo', serif; font-size: 1.8rem; color: var(--point-gold); margin: 0; }
        #pageDesc { font-size: 0.9rem; opacity: 0.9; margin-top: 8px; font-weight: 300; }
        
        .field { margin-bottom: 18px; text-align: left; }
        label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: var(--point-gold); font-weight: 500; }
        input, select { width: 100%; background: var(--input-bg); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; padding: 12px; color: white; font-size: 0.95rem; box-sizing: border-box; outline: none; }
        input::placeholder { color: rgba(255,255,255,0.4); }
        
        .dropdown-group { display: flex; gap: 8px; }
        
        .unknown-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: #ccc; padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; cursor: pointer; margin-top: 8px; transition: 0.3s; }
        .unknown-btn.active { background: var(--point-gold); color: #000; border-color: var(--point-gold); font-weight: 700; }
        
        .submit-btn { width: 100%; background: linear-gradient(135deg, var(--point-gold), #f57c00); color: #fff; border: none; padding: 16px; border-radius: 20px; font-weight: 700; font-size: 1.1rem; margin-top: 10px; cursor: pointer; box-shadow: 0 5px 20px rgba(0,0,0,0.3); transition: all 0.3s ease; }
        
        .hidden { display: none !important; }
        footer { text-align: center; margin-top: 25px; color: rgba(255,255,255,0.6); font-size: 0.75rem; }

        /* ✅ [수정] 로딩 오버레이 CSS (공 관련 제거 및 간격 조정) */
        .effect-layer { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; 
            display: none; /* JS로 제어 */
            flex-direction: column; justify-content: center; align-items: center; 
            z-index: 9999; 
        }
        
        /* 둥둥 떠다니는 로고 */
        .floating-logo {
            position: absolute;
            width: 300px; height: auto;
            /* ✅ [수정] 로고 위치를 38% -> 35%로 약간 올려 간격 확보 */
            top: 35%; 
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10002; 
            animation: floatLogo 3s ease-in-out infinite;
            opacity: 0; transition: opacity 0.5s;
        }
        .floating-logo.visible { opacity: 1; }

        /* 로딩 텍스트 및 게이지 바 컨테이너 */
        .analysis-info {
            position: absolute;
            width: 80%; max-width: 300px;
            /* ✅ [수정] 텍스트 위치를 30% -> 25%로 내려서 로고와 더 멀어지게 함 */
            bottom: 25%; 
            display: none;
            flex-direction: column; align-items: center;
            z-index: 10001;
            animation: fadeIn 0.5s ease-in forwards;
        }
        .loading-msg { 
            color: #ffd700; 
            font-size: 1.3rem; font-weight: 700; 
            margin-bottom: 20px; text-align: center; 
            text-shadow: 0 0 10px rgba(255,215,0,0.5); 
            min-height: 1.5em; 
        }
        .progress-container { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.2); border-radius: 10px; overflow: hidden; position: relative; }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #b8860b, #ffd700); box-shadow: 0 0 10px #ffd700; border-radius: 10px; transition: width 0.3s ease; }
        
        @keyframes floatLogo {
            0%, 100% { transform: translate(-50%, -50%) translateY(0); }
            50% { transform: translate(-50%, -50%) translateY(-15px); }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    </style>
</head>
<body>

    <div class="background-overlay"></div>
    <div class="background-blur"></div>

    <div class="container" id="mainContainer">
        <header>
            <div class="logo" onclick="location.href='/'">
                <img src="/textlogo.png" alt="Saju Logo">
            </div>
            <div class="user-nav">
                <div id="coinBox" class="hidden"><span id="userCoins">0</span> 🪙</div>
                <div class="profile-circle" onclick="location.href='/profile'">
                    <img id="userProfileImg" src="/avatar.png" alt="Profile">
                </div>
            </div>
        </header>

        <main id="inputSection">
            <section class="intro-section">
                <h2 id="pageTitle">...</h2>
                <p id="pageDesc">...</p>
            </section>

            <form id="fortuneForm">
                <div class="field">
                    <label>ชื่อจริง (ชื่อ-นามสกุล)</label>
                    <input type="text" id="realName" placeholder="ระบุชื่อจริง" required>
                </div>
                <div class="field">
                    <label>ชื่อเล่น</label>
                    <input type="text" id="nickName" placeholder="ระบุชื่อเล่น" required>
                </div>
                <div class="field">
                    <label>วันเดือนปีเกิด</label>
                    <div class="dropdown-group">
                        <select id="birthDay" required><option value="" disabled selected>วันที่</option></select>
                        <select id="birthMonth" required>
                            <option value="" disabled selected>เดือน</option>
                            <option value="01">ม.ค.</option><option value="02">ก.พ.</option>
                            <option value="03">มี.ค.</option><option value="04">เม.ย.</option>
                            <option value="05">พ.ค.</option><option value="06">มิ.ย.</option>
                            <option value="07">ก.ค.</option><option value="08">ส.ค.</option>
                            <option value="09">ก.ย.</option><option value="10">ต.ค.</option>
                            <option value="11">พ.ย.</option><option value="12">ธ.ค.</option>
                        </select>
                        <select id="birthYear" required><option value="" disabled selected>ปี พ.ศ.</option></select>
                    </div>
                </div>
                <div class="field">
                    <label>เวลาเกิด</label>
                    <div class="dropdown-group">
                        <select id="birthHour" required><option value="" disabled selected>ชม.</option></select>
                        <select id="birthMin" required><option value="" disabled selected>นาที</option></select>
                    </div>
                    <button type="button" id="unknownTimeBtn" class="unknown-btn">ไม่ทราบเวลาเกิด</button>
                </div>
                <div class="field">
                    <label>เพศ</label>
                    <select id="gender" required>
                        <option value="" disabled selected>เลือกเพศ</option>
                        <option value="male">ชาย</option>
                        <option value="female">หญิง</option>
                        <option value="lgbt">LGBTQ+</option>
                        <option value="other">อื่นๆ</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">ดูคำทำนายของคุณ 🪙 2</button>
            </form>
        </main>

        <footer>
            <p>© 2026 Saju. บันทึกแห่งโชคชะตา</p>
        </footer>
    </div>

    <div class="effect-layer" id="loadingOverlay">
        
        <img src="/logo.png" class="floating-logo" id="loadingLogo" alt="Loading Logo">
        
        <div class="analysis-info" id="analysisInfo">
            <div class="loading-msg" id="loadingMsg">กำลังเชื่อมต่อกับดวงดาว...</div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <p style="color: #ffd700; font-size: 0.8rem; margin-top: 10px; opacity: 0.7;">ซาจู : ศาสตร์แห่งดวงดาวและธาตุทั้งห้า</p>
        </div>
    </div>

    <script>
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const API_KEY = 'wodmfjc8202oj4tnguf9wo2k2jrnjdwow0011k2k2n3nfnnfndsiow901o2kkemrx999dej3j';
            
            const pathParts = window.location.pathname.split('/');
            const type = pathParts[pathParts.length - 1] || 'saju';

            const fortuneForm = document.getElementById('fortuneForm');
            const submitBtn = document.getElementById('submitBtn');
            const inputSection = document.getElementById('inputSection');
            
            // 로딩 엘리먼트들
            const loadingOverlay = document.getElementById('loadingOverlay');
            // zoomBall 변수 삭제됨
            const loadingLogo = document.getElementById('loadingLogo');
            const analysisInfo = document.getElementById('analysisInfo');
            const progressBar = document.getElementById('progressBar');
            const loadingMsg = document.getElementById('loadingMsg');

            const config = {
                saju: { title: "ซาจู (Saju)", desc: "วิเคราะห์ดวงชะตาเกาหลีแบบเจาะลึก" },
                gacha: { title: "เสี่ยงทาย (Gacha)", desc: "สุ่มโชคชะตาประจำวันของคุณ" },
                love: { title: "ความรัก (Love)", desc: "วิเคราะห์เนื้อคู่และความสมพงษ์" }
            };
            
            const loadingMessages = [
                "กำลังเปิดสมุดบัญชีโชคชะตา...",
                "คำนวณตำแหน่งดวงดาวและธาตุทั้งห้า...",
                "มหาเทพกำลังเขียนคำทำนาย...",
                "อีกนิดเดียว... โชคชะตาของคุณกำลังจะปรากฏ"
            ];

            const page = config[type] || config.saju;
            document.getElementById('pageTitle').innerText = page.title;
            document.getElementById('pageDesc').innerText = page.desc;

            // 유저 정보 로드
            try {
                const res = await fetch('/api/user/profile', { headers: { 'x-api-key': API_KEY } });
                if (res.ok) {
                    const user = await res.json();
                    document.getElementById('userProfileImg').src = user.profile_img || '/avatar.png';
                    document.getElementById('userCoins').innerText = user.coins || 0;
                    document.getElementById('coinBox').classList.remove('hidden');
                }
            } catch (e) { console.error(e); }

            // 날짜/시간 생성
            const daySel = document.getElementById('birthDay');
            const monthSel = document.getElementById('birthMonth');
            const yearSel = document.getElementById('birthYear');
            const hourSel = document.getElementById('birthHour');
            const minSel = document.getElementById('birthMin');
            
            for(let i=1; i<=31; i++) daySel.add(new Option(i, i < 10 ? `0${i}` : i));

            const currentYearAD = new Date().getFullYear();
            const startYearBE = currentYearAD + 543; 
            const endYearBE = 1930 + 543; 
            for(let i = startYearBE; i >= endYearBE; i--) {
                yearSel.add(new Option(`พ.ศ. ${i}`, i));
            }

            for(let i=0; i<24; i++) hourSel.add(new Option(i<10?`0${i}`:i, i<10?`0${i}`:i));
            for(let i=0; i<60; i++) minSel.add(new Option(i<10?`0${i}`:i, i<10?`0${i}`:i));

            let isTimeUnknown = false;
            document.getElementById('unknownTimeBtn').addEventListener('click', function() {
                isTimeUnknown = !isTimeUnknown;
                this.classList.toggle('active');
                hourSel.disabled = minSel.disabled = isTimeUnknown;
                hourSel.style.opacity = minSel.style.opacity = isTimeUnknown ? '0.3' : '1';
                if(isTimeUnknown) { hourSel.value = ""; minSel.value = ""; }
            });

            // 폼 검증
            const requiredInputs = document.querySelectorAll('input[required], select[required]');
            requiredInputs.forEach(input => {
                input.oninvalid = function(e) {
                    e.target.setCustomValidity("");
                    if (!e.target.validity.valid) {
                        e.target.setCustomValidity("กรุณากรอกข้อมูลในช่องนี้");
                    }
                };
                input.oninput = function(e) { e.target.setCustomValidity(""); };
            });

            // ✅ [수정된 부분] 공 줌 애니메이션 로직 제거
            let fakeProgressInterval = null;

            fortuneForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                // 1. 화면 전환
                loadingOverlay.style.display = 'flex';
                
                // 공 애니메이션 없이 바로 로고와 게이지 표시 (짧은 지연시간으로 부드럽게)
                setTimeout(() => {
                    analysisInfo.style.display = 'flex';
                    loadingLogo.classList.add('visible');
                    
                    // 게이지 바 애니메이션 시작
                    let progress = 0;
                    let msgIdx = 0;
                    fakeProgressInterval = setInterval(() => {
                        if (progress < 90) progress += Math.random() * 3; // 조금 더 빠르게
                        progressBar.style.width = progress + '%';
                        
                        // 텍스트 변경
                        if (progress > (msgIdx + 1) * 25 && msgIdx < loadingMessages.length - 1) {
                            msgIdx++;
                            loadingMsg.style.opacity = 0;
                            setTimeout(() => {
                                loadingMsg.innerText = loadingMessages[msgIdx];
                                loadingMsg.style.opacity = 1;
                            }, 300);
                        }
                    }, 200);

                }, 100); // 1.5초 대기 제거 -> 0.1초 후 바로 시작

                const resultId = generateUUID();
                const payload = {
                    resultId: resultId,
                    type: type,
                    realName: document.getElementById('realName').value,
                    nickName: document.getElementById('nickName').value,
                    birthDate: `${yearSel.value}-${monthSel.value}-${daySel.value}`,
                    birthTime: isTimeUnknown ? "unknown" : `${hourSel.value}:${minSel.value}`,
                    gender: document.getElementById('gender').value
                };

                try {
                    // 2. 백그라운드 API 요청
                    const res = await fetch('/api/fortune/analyze', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
                        body: JSON.stringify(payload)
                    });

                    if (res.ok) {
                        // 3. 성공 시 완료 처리 및 이동
                        clearInterval(fakeProgressInterval);
                        progressBar.style.width = '100%';
                        loadingMsg.innerText = "วิเคราะห์เสร็จสิ้น!";
                        
                        setTimeout(() => {
                            window.location.replace(`/result/${type}/${resultId}`);
                        }, 800); 
                    } else if (res.status === 403) {
                        // 실패 시 리셋
                        resetLoading();
                        showCoinAlert(); 
                    } else {
                        throw new Error("Server Error");
                    }
                } catch (err) {
                    console.error(err);
                    resetLoading();
                    alert("เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง");
                }
            });

            function resetLoading() {
                clearInterval(fakeProgressInterval);
                loadingOverlay.style.display = 'none';
                // zoomBall 관련 코드 삭제됨
                loadingLogo.classList.remove('visible');
                analysisInfo.style.display = 'none';
                progressBar.style.width = '0%';
            }
        });
    </script>
</body>
</html>
