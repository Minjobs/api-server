<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-X0NBJELTKD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-X0NBJELTKD'); 
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ซาจู - เติมคอยน์</title>
            <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-overlay: rgba(0, 0, 0, 0.38); 
            --text-white: #ffffff;  
            --point-gold: #ffd700;
            --border-line: rgba(200, 200, 200, 0.8); 
            --card-bg: rgba(0, 0, 0, 0.6);
            --line-green: #06C755;
            --btn-gradient: linear-gradient(135deg, #ffd700, #f57c00);
        }

        body {
            margin: 0; padding: 0;
            background-color: #f5f5f5; 
            font-family: 'Kanit', sans-serif;
            color: var(--text-white);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        .background-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-image: url('/background.jpg'); 
            background-size: cover; background-position: center;
            background-attachment: fixed; opacity: 0.8; 
        }

        .background-blur {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            backdrop-filter: blur(7px) brightness(1.0);
        }

        .container {
            width: 88%; max-width: 440px; 
            margin: 20px 0;
            background-color: var(--bg-overlay); 
            border-radius: 30px; 
            padding: 20px 15px 35px 15px;
            box-sizing: border-box;
            backdrop-filter: blur(7px); 
            border: 3px solid var(--border-line); 
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
        }

        header {
            width: 100%; display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; padding: 0 5px;
            box-sizing: border-box;
        }

        .logo-container {
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .logo-img {
            height: 38px; 
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
        }

        .user-coins {
            background: rgba(255, 215, 0, 0.2); border: 1px solid var(--point-gold);
            padding: 6px 14px; border-radius: 20px; font-size: 0.9rem; font-weight: 700; color: var(--point-gold);
            display: flex; align-items: center; gap: 5px;
        }

        .shop-title { margin-bottom: 25px; }
        .shop-title h2 { font-size: 1.6rem; color: var(--point-gold); margin: 0; font-weight: 700; }
        .shop-title p { font-size: 0.95rem; opacity: 0.9; font-weight: 300; margin-top: 8px; }

        .coin-card {
            background: var(--card-bg);
            border: 1px solid var(--point-gold); 
            border-radius: 22px;
            margin-bottom: 20px;
            padding: 15px;
            display: flex; justify-content: space-between; align-items: center;
            position: relative;
            box-sizing: border-box;
            cursor: pointer; 
            transition: transform 0.1s ease, background 0.2s;
        }

        .coin-card:active {
            transform: scale(0.97); 
            background: rgba(255, 215, 0, 0.1); 
        }

        .coin-info { display: flex; align-items: center; gap: 12px; pointer-events: none; }
        .coin-icon { font-size: 1.8rem; }
        .coin-text { text-align: left; }
        .coin-text .amount { font-size: 1.15rem; font-weight: 700; color: #fff; }
        .coin-text .sub { font-size: 0.8rem; opacity: 0.8; font-weight: 300; }

        .buy-button {
            background: var(--btn-gradient);
            color: #000;
            padding: 8px 15px;
            border-radius: 14px;
            box-shadow: 0 4px 10px rgba(255, 215, 0, 0.3);
            display: flex; flex-direction: column; align-items: center;
            cursor: pointer;
            border: none;
            min-width: 85px;
        }

        .buy-button .price { font-size: 1.25rem; font-weight: 800; line-height: 1; }
        .buy-button .unit { font-size: 0.75rem; margin-top: 2px; font-weight: 700; }

        .promo-badge {
            background: #ff4757; color: white;
            font-size: 0.7rem; font-weight: 700;
            padding: 4px 10px; border-radius: 10px;
            position: absolute; top: -10px; right: 15px;
            box-shadow: 0 4px 8px rgba(255, 71, 87, 0.3);
            z-index: 10;
        }

        .contact-section { 
            width: 100%;
            margin-top: 35px; 
            border-top: 1px solid rgba(255,255,255,0.2); 
            padding-top: 25px; 
            box-sizing: border-box;
        }
        .contact-section p { font-size: 0.85rem; opacity: 0.9; margin-bottom: 15px; font-weight: 300; }
        
        .line-link {
            background-color: var(--line-green);
            color: white; border: none; 
            width: 100%; 
            padding: 14px;
            border-radius: 18px; font-size: 1rem; font-weight: 700;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            text-decoration: none; 
            box-sizing: border-box;
            transition: filter 0.2s;
        }
        .line-link:active { filter: brightness(0.9); }
        .line-link img { width: 20px; height: 20px; }

        footer { margin-top: 30px; font-size: 0.75rem; opacity: 0.7; font-weight: 300; }
    </style>
</head>
<body>

    <div class="background-overlay"></div>
    <div class="background-blur"></div>

    <div class="container">
        <header>
            <div class="logo-container" onclick="location.href='/'">
                <img src="textlogo.png" alt="Saju Logo" class="logo-img">
            </div>
            <div class="user-coins">
                <span id="displayCoins">0</span> 🪙
            </div>
        </header>

        <main>
            <section class="shop-title">
                <h2>เติมคอยน์</h2>
                <p>คอยน์สำหรับใช้บริการพยากรณ์ศาสตร์เกาหลี</p>
            </section>

            <div class="coin-card" onclick="startPaymentProcess(3, 30)">
                <div class="coin-info">
                    <div class="coin-icon">🪙</div>
                    <div class="coin-text">
                        <div class="amount">3 คอยน์</div>
                        <div class="sub">เริ่มต้นโชคชะตา</div>
                    </div>
                </div>
                <button class="buy-button">
                    <span class="price">30</span>
                    <span class="unit">บาท</span>
                </button>
            </div>

            <div class="coin-card" onclick="startPaymentProcess(5, 45)">
                <span class="promo-badge">ประหยัด ลด 10%</span>
                <div class="coin-info">
                    <div class="coin-icon">🪙</div>
                    <div class="coin-text">
                        <div class="amount">5 คอยน์</div>
                        <div class="sub">ยอดนิยมที่สุด</div>
                    </div>
                </div>
                <button class="buy-button">
                    <span class="price">45</span>
                    <span class="unit">บาท</span>
                </button>
            </div>

            <div class="coin-card" onclick="startPaymentProcess(10, 80)">
                <span class="promo-badge">คุ้มค่าที่สุด ลด 20%</span>
                <div class="coin-info">
                    <div class="coin-icon">🪙</div>
                    <div class="coin-text">
                        <div class="amount">10 คอยน์</div>
                        <div class="sub">เพื่อความคุ้มค่าสูงสุด</div>
                    </div>
                </div>
                <button class="buy-button">
                    <span class="price">80</span>
                    <span class="unit">บาท</span>
                </button>
            </div>

            <section class="contact-section">
                <p>หากมีข้อสงสัยหรือพบปัญหาในการใช้งาน</p>
                <a href="https://line.me/ti/p/@your_id" class="line-link">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/4/41/LINE_logo.svg" alt="Line">
                    ติดต่อแอดมินทาง Line
                </a>
            </section>
        </main>

        <footer>
            © 2026 Saju. บันทึกโชคชะตาด้วยความใส่ใจ
        </footer>
    </div>

    <script src="/js/analytics.js"></script>

    <script>
        const API_KEY = 'wodmfjc8202oj4tnguf9wo2k2jrnjdwow0011k2k2n3nfnnfndsiow901o2kkemrx999dej3j';

        document.addEventListener('DOMContentLoaded', async () => {
            // ✅ [추가] 상점 목록 조회 이벤트 (view_item_list)
            if (typeof Analytics !== 'undefined') {
                Analytics.log('view_item_list', {
                    item_list_name: 'Coin Shop',
                    items: [
                        { item_id: 'coin_3', item_name: '3 Coins', price: 30, currency: 'THB' },
                        { item_id: 'coin_5', item_name: '5 Coins', price: 45, currency: 'THB' },
                        { item_id: 'coin_10', item_name: '10 Coins', price: 80, currency: 'THB' }
                    ]
                });
            }

            try {
                const res = await fetch('/api/user/profile', { headers: { 'x-api-key': API_KEY } });
                if (res.ok) {
                    const user = await res.json();
                    document.getElementById('displayCoins').innerText = user.coins || 0;
                }
            } catch (e) { console.error(e); }
        });

        function startPaymentProcess(coinAmount, bahtAmount) {
            // ✅ [추가] 결제 시작 이벤트 (begin_checkout)
            if (typeof Analytics !== 'undefined') {
                Analytics.log('begin_checkout', {
                    currency: 'THB',
                    value: bahtAmount,
                    items: [{
                        item_id: `coin_pack_${coinAmount}`,
                        item_name: `${coinAmount} Coins Pack`,
                        price: bahtAmount,
                        quantity: 1
                    }]
                });
            }
            goToPayment(coinAmount, bahtAmount);
        }

        async function goToPayment(coinAmount, bahtAmount) {
            try {
                const res = await fetch('/api/payment/intent', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
                    body: JSON.stringify({ coinAmount, bahtAmount })
                });
                
                const data = await res.json();
                
                if (data.transactionId) {
                    window.location.href = `/checkout/${data.transactionId}`;
                } else {
                    alert("เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้งค่ะ");
                }
            } catch (err) {
                console.error(err);
                alert("ขออภัยค่ะ ระบบขัดข้องชั่วคราว");
            }
        }
    </script>
</body>
</html>
